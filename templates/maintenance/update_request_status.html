{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body p-4">
                <h3 class="mb-4"><i class="fas fa-clipboard-check me-2"></i>Update Request Status</h3>
                
                <div class="mb-4 p-3 bg-light rounded">
                    <h5 class="mb-1">{{ maintenance_request.title }}</h5>
                    <p class="text-muted small mb-2">Requested by {{ maintenance_request.user.username }}</p>
                    <p class="mb-0">{{ maintenance_request.description }}</p>
                </div>

                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{% url 'staff_dashboard' %}" class="btn btn-light">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">Save Status</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
