{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm mt-4">
            <div class="card-body p-4">
                <h2 class="page-title"><i class="fas fa-edit me-2"></i>Update Request</h2>
                
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    
                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a href="{% url 'my_requests' %}" class="btn btn-light">Cancel</a>
                        <button type="submit" class="btn btn-primary px-4">Update Request</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
